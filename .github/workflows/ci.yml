name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (server persistence) needs Node >= 22.5; 24 is the
          # active LTS and the version this workflow is verified against.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (server src+test, web)
        run: npm run typecheck
      - name: Test (server node:test, web render smoke)
        run: npm test
      - name: Build (server tsc -> dist, web vite -> web/dist)
        run: npm run build
